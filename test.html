<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Test clavier">
<meta name="theme-color" content="#004C92">
<title>Test clavier</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       margin:0;padding:16px;background:#f4f5f7;color:#111827;font-size:16px}
  h1{font-size:18px;margin:0 0 4px}
  p.s{margin:0 0 16px;color:#6b7280;font-size:13px}
  .b{background:#fff;border:1px solid #e2e5ea;border-radius:12px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:13px;color:#6b7280;margin-bottom:6px;font-weight:600}
  input,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #cbd2da;
                 border-radius:10px;background:#fff;color:#111827}
  textarea{height:70px}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:0;border-radius:10px;
         background:#004C92;color:#fff;margin-top:4px}
  button:active{background:#003A70}
  #etat{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;
        background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px;
        height:210px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  .v{font-size:15px;font-weight:600;padding:10px 12px;border-radius:10px;margin-bottom:10px}
  .ok{background:#dcfce7;color:#14532d}
  .ko{background:#fee2e2;color:#7f1d1d}
  .at{background:#e0f2fe;color:#075985}
</style>
</head>
<body>

<h1>Test du clavier</h1>
<p class="s">Touche chaque champ l'un apres l'autre. La page dit ce qu'il se passe.
Rien n'est envoye nulle part.</p>

<div id="verdict" class="v at">Touche le premier champ pour commencer.</div>

<div class="b">
  <label>1 &mdash; Champ nu (aucun attribut)</label>
  <input id="a">
</div>

<div class="b">
  <label>2 &mdash; Comme celui de l'application (nom)</label>
  <input id="b" type="text" autocomplete="off" autocapitalize="characters"
         autocorrect="off" spellcheck="false" placeholder="Ton nom">
</div>

<div class="b">
  <label>3 &mdash; Champ masque (code)</label>
  <input id="c" type="password" autocomplete="off" placeholder="......">
</div>

<div class="b">
  <label>4 &mdash; Zone de texte</label>
  <textarea id="d" placeholder="Essaie d'ecrire ici"></textarea>
</div>

<div class="b">
  <label>5 &mdash; Un bouton, pour comparer</label>
  <button id="e" type="button">Appuie ici</button>
</div>

<div class="b">
  <label>Ce que voit la page</label>
  <div id="etat">en attente...</div>
</div>

<script>
var L = [], H0 = null;
var etat = document.getElementById('etat');
var verdict = document.getElementById('verdict');

function log(t){
  var d = new Date();
  L.unshift(('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)+'  '+t);
  if(L.length > 60) L.pop();
  etat.textContent = L.join('\n');
}
function dire(txt, cl){ verdict.textContent = txt; verdict.className = 'v ' + cl; }

function hauteur(){
  return (window.visualViewport ? Math.round(window.visualViewport.height) : window.innerHeight);
}

['a','b','c','d'].forEach(function(id){
  var e = document.getElementById(id);
  var n = id.toUpperCase();
  e.addEventListener('touchstart', function(){ log(n + ' : doigt pose'); }, {passive:true});
  e.addEventListener('pointerdown', function(){ log(n + ' : pointeur'); });
  e.addEventListener('focus', function(){
    log(n + ' : FOCUS pris, hauteur ' + hauteur());
    setTimeout(function(){
      var h = hauteur();
      if(H0 !== null && h < H0 - 80){
        dire('Le clavier s\'ouvre. (' + H0 + ' vers ' + h + ')', 'ok');
        log(n + ' : clavier ouvert, hauteur ' + h);
      } else {
        dire('FOCUS pris, mais AUCUN clavier. (hauteur ' + h + ', repos ' + H0 + ')', 'ko');
        log(n + ' : pas de clavier, hauteur ' + h);
      }
    }, 900);
  });
  e.addEventListener('blur', function(){ log(n + ' : focus perdu'); });
  e.addEventListener('input', function(){
    dire('Ca ecrit ! Champ ' + n + ' = ' + e.value, 'ok');
    log(n + ' : saisie ' + e.value);
  });
  e.addEventListener('keydown', function(ev){ log(n + ' : touche ' + ev.key); });
});

document.getElementById('e').addEventListener('click', function(){
  log('BOUTON : appuye, hauteur ' + hauteur());
  dire('Le bouton repond. Maintenant essaie les champs.', 'at');
});

document.addEventListener('touchstart', function(ev){
  var c = ev.target;
  log('page : doigt sur ' + (c.id ? '#'+c.id : c.tagName));
}, {passive:true, capture:true});

if(window.visualViewport){
  window.visualViewport.addEventListener('resize', function(){
    log('hauteur visible : ' + hauteur());
  });
}

window.addEventListener('load', function(){
  H0 = hauteur();
  var seul = (window.navigator.standalone === true) ||
             (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if(seul){
    dire('Mode ECRAN D ACCUEIL. C est le bon test : touche les champs.', 'at');
  } else {
    dire('Mode NAVIGATEUR (Safari). Ce test ne prouve rien : ajoute la page a l ecran d accueil et rouvre-la depuis l icone.', 'ko');
  }
  log('mode : ' + (seul ? 'ECRAN D ACCUEIL' : 'navigateur'));
  log('hauteur au repos : ' + H0);
  log('ecran : ' + screen.width + 'x' + screen.height + ', fenetre : ' + innerWidth + 'x' + innerHeight);
  log('visualViewport : ' + (window.visualViewport ? 'oui' : 'non'));
  log('pret.');
});
</script>
</body>
</html>
